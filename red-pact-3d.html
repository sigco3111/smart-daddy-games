const expNeed=l=>60+(l-1)*62;
function heroStats(id){
 const h=HEROES[id],l=G.level;
 const s={hp:Math.round(h.base.hp+h.grow.hp*(l-1)),mp:Math.round(h.base.mp+h.grow.mp*(l-1)),
  atk:Math.round(h.base.atk+h.grow.atk*(l-1)),def:Math.round(h.base.def+h.grow.def*(l-1)),spd:h.spd};
 if(id==='rian'){
  const w=ITEMS[G.equip.weapon],a=ITEMS[G.equip.armor],c=G.equip.acc?ITEMS[G.equip.acc]:null;
  s.atk+=(w&&w.atk)||0; s.def+=((a&&a.def)||0)+((c&&c.def)||0); s.hp+=(c&&c.hp)||0;
 }
 return s;
}
function gainExp(n){
 G.exp+=n;
 while(G.exp>=expNeed(G.level)){
  G.exp-=expNeed(G.level); G.level++;
  G.party.forEach(id=>{const e=G.hobjs[id];if(!e)return;const st=heroStats(id);e.hp=st.hp;e.mp=st.mp;e.down=false;
   G.fx.push({type:'lvl',x:e.x,y:e.y,t:0,dur:1.2});});
  toast('레벨 업!  Lv.'+G.level,'#ffe08a'); AU.sfx('level');
  if(G.level===3)toast('리안의 신기술 습득 — [2] 회전참','#8ad6ff');
 }
}
function give(id,q=1){
 const it=G.inv.find(v=>v.id===id);
 if(it)it.q+=q; else G.inv.push({id,q});
 toast('획득: '+ITEMS[id].n+(q>1?' x'+q:''),'#c9e6a8'); AU.sfx('coin');
}
function takeItem(id,q=1){
 const i=G.inv.findIndex(v=>v.id===id);
 if(i<0)return false;
 G.inv[i].q-=q; if(G.inv[i].q<=0)G.inv.splice(i,1); return true;
}
const hasItem=id=>G.inv.some(v=>v.id===id);

function buildRoad(){
 const w=56,h=26,g=[];
 for(let y=0;y<h;y++){g.push([]);for(let x=0;x<w;x++){
  let c='.';
  if(x===0||y===0||x===w-1||y===h-1)c='T';
  else if(y<=2||y>=h-3)c=(hash2(x,y)<.55?'T':',');
  else if(hash2(x,y)<.06)c='t';
  else if(hash2(x+99,y)<.05)c='T';
  else if(hash2(x+201,y)<.04)c='r';
  else if(hash2(x+301,y)<.3)c=',';
  g[y].push(c);}}
 for(let y=17;y<=21;y++)for(let x=5;x<=12;x++)if(hash2(x,y)<.92)g[y][x]='w';
 for(let x=0;x<w;x++)for(let y=11;y<=13;y++){if(y===12||hash2(x,y+50)<.6)g[y][x]='-';}
 for(let y=12;y<h;y++)for(let x=28;x<=30;x++){if(x===29||hash2(x+70,y)<.6)g[y][x]='-';}
 for(let y=11;y<=13;y++){g[y][0]='-';g[y][w-1]='=';g[y][w-2]='=';}
 for(let x=28;x<=30;x++){g[h-1][x]='-';g[h-2][x]='-';}
 g[10][w-2]='R';g[14][w-2]='R';g[10][w-1]='R';g[14][w-1]='R';
 return g.map(r=>r.join(''));
}

function buildVill(){
 const w=44,h=24,g=[];
 for(let y=0;y<h;y++){g.push([]);for(let x=0;x<w;x++){
  let c='.';
  if(x===0||y===0||x===w-1||y===h-1)c='T';
  else if(hash2(x+5,y+55)<.24)c=',';
  else if(hash2(x*7,y*3+9)<.03)c='t';
  g[y].push(c);}}
 const house=(hx,hy,hw,hh,burn)=>{for(let y=hy;y<hy+hh;y++)for(let x=hx;x<hx+hw;x++)g[y][x]=burn?'H':'h';};
 house(6,5,5,3,true); house(15,4,5,3,false); house(26,5,5,3,true); house(34,6,5,3,false);
 house(7,15,5,3,false); house(16,17,5,3,true); house(30,15,6,3,false);
 for(let y=9;y<=14;y++)for(let x=17;x<=27;x++)g[y][x]=(hash2(x,y)<.85?'=':'.');
 g[11][22]='O';
 for(let y=1;y<=9;y++)for(let x=21;x<=22;x++)g[y][x]='-';
 for(let x=20;x<=23;x++)g[0][x]='-';
 for(let x=3;x<=12;x++){if(g[20][x]==='.')g[20][x]='f';}
 return g.map(r=>r.join(''));
}

function buildRuin(){
 const w=48,h=28,g=[];
 for(let y=0;y<h;y++){g.push([]);for(let x=0;x<w;x++){
  let c='x';
  if(x===0||y===0||x===w-1||y===h-1)c='R';
  else if(y<=1||y>=h-2)c='R';
  else if(hash2(x*3,y*7)<.08)c='R';
  else if(hash2(x+11,y+31)<.04)c='&';
  else if(hash2(x+77,y+13)<.045)c='c';
  else if(hash2(x+41,y+91)<.25)c='X';
  g[y].push(c);}}
 for(let x=1;x<w-1;x++)for(let y=12;y<=16;y++){if(g[y][x]!=='c')g[y][x]=(hash2(x,y+7)<.2?'X':'x');}
 for(let y=13;y<=15;y++){g[y][0]='x';g[y][1]='x';}
 for(let y=10;y<=18;y++){const open=(y>=13&&y<=15);g[y][w-3]=open?'x':'R';g[y][w-2]=open?'x':'R';g[y][w-1]=open?'g':'R';}
 return g.map(r=>r.join(''));
}

function buildArena(){
 const w=30,h=19,g=[];
 for(let y=0;y<h;y++){g.push([]);for(let x=0;x<w;x++){
  let c='x';
  const dx=(x-14.5)/13.2,dy=(y-9)/8.4;
  if(dx*dx+dy*dy>1)c='R'; else if(hash2(x+3,y+8)<.15)c='X';
  g[y].push(c);}}
 for(let y=14;y<h;y++)for(let x=13;x<=16;x++)g[y][x]=(y===h-1?'g':'x');
 g[3][13]='R';g[3][16]='R';
 return g.map(r=>r.join(''));
}

// ---------- 충돌/탐색 ----------
const SOLID={'#':1,'*':1,'B':1,'T':1,'t':1,'r':1,'w':1,'f':1,'h':1,'H':1,'R':1,'^':1,'&':1,'O':1,'_':1,'%':1,'c':1};
function tileAt(tx,ty){if(!G.map||tx<0||ty<0||tx>=G.map.w||ty>=G.map.h)return '#';return G.map.g[ty][tx];}
function solidAt(px,py){return !!SOLID[tileAt(Math.floor(px/TS),Math.floor(py/TS))];}
function passable(x,y,r){return !solidAt(x-r,y-r)&&!solidAt(x+r,y-r)&&!solidAt(x-r,y+r)&&!solidAt(x+r,y+r);}
function moveEnt(e,dx,dy){
 if(dx){const nx=e.x+dx;if(passable(nx,e.y,e.r))e.x=nx;}
 if(dy){const ny=e.y+dy;if(passable(e.x,ny,e.r))e.y=ny;}
}
function findOpen(tx,ty){
 if(!SOLID[tileAt(tx,ty)])return{x:tx,y:ty};
 for(let r=1;r<9;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
  if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;
  if(!SOLID[tileAt(tx+dx,ty+dy)])return{x:tx+dx,y:ty+dy};}
 return{x:tx,y:ty};
}

function loadMap(id,tx,ty){
 const M=MAPS[id];
 if(!M.grid)M.grid=M.build();
 G.mapId=id; G.map={id,w:M.grid[0].length,h:M.grid.length,g:M.grid,def:M};
 G.ents=[]; G.projs=[]; G.boss=null;
 G.party.forEach((hid,i)=>{
  const e=G.hobjs[hid];
  const p=findOpen(tx+(i===1?-1:i===2?1:0),ty+(i?1:0));
  e.x=(p.x+.5)*TS; e.y=(p.y+.5)*TS;
  if(e.down){e.down=false;e.hp=Math.max(e.hp,Math.round(heroStats(hid).hp*.35));}
  G.ents.push(e);});
 (M.npcs||[]).forEach(nd=>{
  if(nd.skip&&nd.skip())return;
  const p=findOpen(nd.x,nd.y);
  G.ents.push({kind:'npc',id:nd.id,name:NPCS[nd.id].n,pal:NPCS[nd.id].pal,helm:NPCS[nd.id].helm,small:NPCS[nd.id].small,
   x:(p.x+.5)*TS,y:(p.y+.5)*TS,fx:0,fy:1,anim:rnd(0,9),mov:false,r:6});});
 (M.foes||[]).forEach(fd=>{
  if(fd.once&&G.flags[fd.once])return;
  const p=findOpen(fd.x,fd.y);
  const f=mkFoe(fd.t,(p.x+.5)*TS,(p.y+.5)*TS);
  if(fd.once)f.once=fd.once;
  G.ents.push(f);});
 (M.props||[]).forEach(pd=>{
  if(pd.sq&&G.flags['got_'+pd.sq])return;
  G.ents.push({kind:'prop',type:pd.type,x:(pd.x+.5)*TS,y:(pd.y+.5)*TS,r:8,txt:pd.txt,sq:pd.sq});});
 G.checkpoint={id,tx,ty};
 AU.setTheme(M.music);
 G.mapBanner={name:M.name,t:0};
 build3DMap();
 if(M.enter&&!G.titleDemo)M.enter();
}

const heroesArr=()=>G.ents.filter(e=>e.kind==='hero'&&!e.down&&e.hp>0);
const foesArr=()=>G.ents.filter(e=>e.kind==='foe');
function nearestHero(f){let b=null,bd=1e9;heroesArr().forEach(h=>{const d=dist(f,h);if(d<bd){bd=d;b=h;}});return b?{e:b,d:bd}:null;}
function aimFace(e,t){const dx=t.x-e.x,dy=t.y-e.y,m=Math.hypot(dx,dy)||1;e.fx=dx/m;e.fy=dy/m;}
function stepToward(e,x,y,d){const dx=x-e.x,dy=y-e.y,m=Math.hypot(dx,dy)||1;moveEnt(e,dx/m*d,dy/m*d);e.anim+=d*.11;}

function mkHero(id){
 const st=heroStats(id);
 return {kind:'hero',id,name:HEROES[id].n,pal:HEROES[id].pal,x:0,y:0,fx:0,fy:1,anim:0,mov:false,
  hp:st.hp,mp:st.mp,atkT:0,atkCd:0,cds:{s1:0,s2:0,sk:0},cd:0,dashT:0,dashDir:null,dashHit:null,
  inv:0,down:false,downT:0,hurtT:0,r:6,big:id==='dain'?1.08:1};
}
function joinParty(id){
 if(G.party.includes(id))return;
 G.party.push(id);
 const e=mkHero(id); G.hobjs[id]=e;
 const pl=G.hobjs.rian; e.x=pl.x+rnd(-14,14); e.y=pl.y+16;
 if(G.ents.includes(pl))G.ents.push(e);
 toast('★ '+HEROES[id].n+'이(가) 동료가 되었다!','#ffe08a'); AU.sfx('level');
}
function mkFoe(type,x,y){
 const d=FOES[type];
 return {kind:'foe',type,name:d.n,hp:d.hp,mhp:d.hp,x,y,fx:0,fy:1,anim:0,mov:false,
  cd:rnd(.4,1.4),windT:0,atkT:0,state:'idle',wt:rnd(.5,2),wdir:null,hurtT:0,stun:0,alertT:0,
  r:d.big?Math.round(6*d.big):6,pat:null,patT:rnd(1,2),phase:1,jump:0,helm:d.helm,pal:d.pal};
}

// ---------- 전투 ----------
function meleeHit(src,atk,range,dot=.3,opts={}){
 let hit=false;
 foesArr().forEach(f=>{
  if(f.hp<=0)return;
  const d=dist(src,f); if(d>range+f.r)return;
  const nx=(f.x-src.x)/(d||1),ny=(f.y-src.y)/(d||1);
  if(d>src.r+6&&nx*src.fx+ny*src.fy<dot)return;
  dmgFoe(f,atk,opts); hit=true;});
 return hit;
}
function dmgFoe(f,amt,opts={}){
 if(f.hp<=0)return;
 const FD=FOES[f.type];
 const crit=Math.random()<.12;
 const dm=Math.max(1,Math.round(amt*rnd(.85,1.15)*(crit?1.6:1)-FD.def));
 f.hp-=dm; f.hurtT=.15;
 if(f.state==='idle'){f.state='chase';f.alertT=.6;}
 if(opts.stun&&!FD.boss){f.stun=Math.max(f.stun,opts.stun);AU.sfx('stun');}
 if(opts.stun&&FD.boss)f.stun=Math.max(f.stun,opts.stun*.3);
 if(opts.kb&&!FD.boss){const s=opts.src||G.hobjs.rian;const d=dist(s,f)||1;moveEnt(f,(f.x-s.x)/d*opts.kb*.07,(f.y-s.y)/d*opts.kb*.07);}
 ftext(f.x+rnd(-4,4),f.y-14,dm,crit?'#ffd76a':'#ffffff',crit);
 puff(f.x,f.y-6,'#a02c2c',4,45);
 AU.sfx(crit?'crit':'hit');
 if(f.hp<=0)killFoe(f);
}
function killFoe(f){
 const FD=FOES[f.type];
 puff(f.x,f.y-4,'#7a1e1e',16,80); puff(f.x,f.y-4,'#3a3a44',8,50);
 AU.sfx('die'); G.stats.kills++;
 gainExp(FD.exp);
 const g=irnd(FD.gold[0],FD.gold[1]);
 if(g>0){addGold(g);ftext(f.x,f.y-26,'+'+g+' G','#ffd76a');}
 if(!FD.boss&&Math.random()<.15)give(Math.random()<.7?'pot_s':'pot_m');
 if(f.once)G.flags[f.once]=true;
 const i=G.ents.indexOf(f); if(i>=0)G.ents.splice(i,1);
 if(G.boss===f)G.boss=null;
 questKill(f);
}
function dmgHero(h,amt,opts={}){
 if(h.inv>0||h.down||G.cut)return;
 const st=heroStats(h.id);
 const dm=Math.max(1,Math.round(amt*rnd(.9,1.1)-st.def));
 h.hp-=dm; h.hurtT=.2; h.inv=Math.max(h.inv,.3);
 ftext(h.x,h.y-16,dm,'#ff7a6a');
 AU.sfx('hurt'); G.shake=Math.max(G.shake,.12);
 if(opts.kb&&opts.src){const d=dist(opts.src,h)||1;moveEnt(h,(h.x-opts.src.x)/d*opts.kb*.07,(h.y-opts.src.y)/d*opts.kb*.07);}
 if(h.hp<=0){
  h.hp=0;
  if(h.id==='rian')gameOver();
  else{h.down=true;h.downT=9;toast(HEROES[h.id].n+'이(가) 쓰러졌다!','#ff9a8a');AU.sfx('die');}
 }
}
function shoot(from,tgt,opts){
 const dx=tgt.x-from.x,dy=(tgt.y-8)-(from.y-8),m=Math.hypot(dx,dy)||1;
 G.projs.push({x:from.x,y:from.y-8,vx:dx/m*opts.spd,vy:dy/m*opts.spd,dmg:opts.dmg,from:opts.from,type:opts.type,life:2.2});
}
function gameOver(){
 if(G.mode==='over')return;
 G.mode='over'; G.overT=0; G.stats.deaths++;
 G.flags.bossFight=false; G.dlg=null; G.cut=null; G.letterT=0; G.letter=0;
 AU.theme=null; AU.sfx('roar');
}

function trySkill(n){
 const pl=G.hobjs.rian;
 if(n===1){
  if(pl.cds.s1>0)return;
  if(pl.mp<8){toast('MP가 부족하다','#8ab6ff');return;}
  pl.mp-=8; pl.cds.s1=3.5; pl.dashT=.18; pl.dashHit={}; pl.inv=.4;
  if(!pl.fx&&!pl.fy)pl.fy=1;
  pl.dashDir={x:pl.fx,y:pl.fy};
  AU.sfx('dash');
  G.fx.push({type:'slash',x:pl.x,y:pl.y,dx:pl.fx,dy:pl.fy,t:0,dur:.22,fol:pl,big:true});
 }
 if(n===2){
  if(G.level<3){toast('회전참은 Lv.3에 각성한다','#8ab6ff');return;}
  if(pl.cds.s2>0)return;
  if(pl.mp<14){toast('MP가 부족하다','#8ab6ff');return;}
  pl.mp-=14; pl.cds.s2=6;
  AU.sfx('fire'); G.shake=Math.max(G.shake,.15);
  G.fx.push({type:'spin',x:pl.x,y:pl.y,t:0,dur:.35,fol:pl});
  foesArr().forEach(f=>{if(dist(pl,f)<52)dmgFoe(f,heroStats('rian').atk*1.5,{kb:150,src:pl});});
 }
 if(n===3){
  if(!G.party.includes('dain'))return;
  const d=G.hobjs.dain; if(d.down)return;
  if(d.cds.sk>0)return;
  d.cds.sk=10; d.atkT=.25;
  AU.sfx('boom'); G.shake=Math.max(G.shake,.28);
  G.fx.push({type:'quake',x:d.x,y:d.y,t:0,dur:.5});
  ftext(d.x,d.y-26,'대지 분쇄!','#e8b46a');
  foesArr().forEach(f=>{if(dist(d,f)<58)dmgFoe(f,heroStats('dain').atk*1.7,{stun:1.6,kb:90,src:d});});
 }
 if(n===4){
  if(!G.party.includes('sera'))return;
  const s=G.hobjs.sera; if(s.down)return;
  if(s.cds.sk>0)return;
  if(s.mp<25){toast('세라의 MP가 부족하다','#8ab6ff');return;}
  s.cds.sk=16; s.mp-=25;
  AU.sfx('heal');
  ftext(s.x,s.y-26,'성역의 빛!','#bfe8ff');
  G.party.forEach(id=>{
   const e=G.hobjs[id]; if(e.down)return;
   const st=heroStats(id); const amt=Math.round(st.hp*.45);
   e.hp=Math.min(st.hp,e.hp+amt);

 }

 const pl=G.hobjs.rian, st=heroStats('rian');
 ['s1','s2','sk'].forEach(k=>{G.party.forEach(id=>{const e=G.hobjs[id];if(e.cds[k]>0)e.cds[k]-=dt;});});
 G.party.forEach(id=>{const e=G.hobjs[id];

 }else{

 }
 if(once('1'))trySkill(1);
 if(once('2'))trySkill(2);
 if(once('3'))trySkill(3);
 if(once('4'))trySkill(4);
 // 동료 AI
 G.party.forEach((id,idx)=>{

 });

function compAI(e,dt,idx){
 const pl=G.hobjs.rian, st=heroStats(e.id), def=HEROES[e.id];
 if(e.down){
  e.downT-=dt;
  if(e.downT<=0){e.down=false;e.hp=Math.round(st.hp*.3);ftext(e.x,e.y-14,'기상!','#ffe08a');}

 }
 let tgt=null,td=1e9;
 foesArr().forEach(f=>{

 e.mov=false;
 if(tgt&&!G.cut){
  aimFace(e,tgt);

   if(td<65){stepToward(e,e.x*2-tgt.x,e.y*2-tgt.y,st.spd*.85*dt);e.mov=true;}
   else if(td>150){stepToward(e,tgt.x,tgt.y,st.spd*dt);e.mov=true;}
   e.cd-=dt;
   if(e.cd<=0&&td<200){e.cd=1.9;e.atkT=.25;shoot(e,tgt,{spd:200,dmg:st.atk,from:'hero',type:'fire'});AU.sfx('fire');}
  }else{
   if(td>26){stepToward(e,tgt.x,tgt.y,st.spd*dt);e.mov=true;}
   else{
    e.cd-=dt;
    if(e.cd<=0){e.cd=1.15;e.atkT=.22;AU.sfx('swing');dmgFoe(tgt,st.atk,{src:e,kb:30});}
   }
  }
 }else{

  if(Math.hypot(tx-e.x,ty-e.y)>24){stepToward(e,tx,ty,st.spd*1.12*dt);e.mov=true;aimFace(e,{x:tx,y:ty});}
 }
}

// ---------- 적 업데이트 ----------
function updateFoes(dt){
 const list=foesArr();
 for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
  const a=list[i],b=list[j],d=dist(a,b);
  if(d<a.r+b.r&&d>0){const push=(a.r+b.r-d)*.5,nx=(b.x-a.x)/d,ny=(b.y-a.y)/d;
   moveEnt(a,-nx*push,-ny*push);moveEnt(b,nx*push,ny*push);}}
 list.forEach(f=>{
  const FD=FOES[f.type];
  if(f.hurtT>0)f.hurtT-=dt; if(f.atkT>0)f.atkT-=dt; if(f.alertT>0)f.alertT-=dt;
  if(f.stun>0){f.stun-=dt;f.mov=false;return;}
  if(G.cut)return;
  if(FD.boss){bossAI(f,dt);return;}
  const nh=nearestHero(f);
  if(!nh)return;
  if(f.state==='idle'){
   if(nh.d<FD.aggro){f.state='chase';f.alertT=.6;AU.sfx('ui');}
   else{
    f.wt-=dt;
    if(f.wt<=0){f.wt=rnd(1,2.6);f.wdir=Math.random()<.45?null:{x:rnd(-1,1),y:rnd(-1,1)};}
    if(f.wdir){const m=Math.hypot(f.wdir.x,f.wdir.y)||1;moveEnt(f,f.wdir.x/m*FD.spd*.35*dt,f.wdir.y/m*FD.spd*.35*dt);f.mov=true;f.anim+=dt*4;aimFace(f,{x:f.x+f.wdir.x,y:f.y+f.wdir.y});}
    else f.mov=false;
    return;
   }
  }
  if(nh.d>FD.aggro*2.4&&f.hp>=f.mhp){f.state='idle';return;}
  const tgt=nh.e;
  if(f.windT>0){
   f.windT-=dt;
   if(f.windT<=0){
    if(FD.ranged){shoot(f,tgt,{spd:165,dmg:FD.atk,from:'foe',type:'arrow'});AU.sfx('swing');}
    else{f.atkT=.22;if(dist(f,tgt)<FD.rng+12)dmgHero(tgt,FD.atk,{src:f,kb:60});}
    f.cd=FD.cd;
   }
   return;
  }
  aimFace(f,tgt);
  if(FD.ranged){
   if(nh.d<70){stepToward(f,f.x*2-tgt.x,f.y*2-tgt.y,FD.spd*dt);f.mov=true;f.anim+=dt*6;}
   else if(nh.d>145){stepToward(f,tgt.x,tgt.y,FD.spd*dt);f.mov=true;f.anim+=dt*6;}
   else f.mov=false;
   f.cd-=dt;
   if(f.cd<=0&&nh.d<160)f.windT=.4;
  }else{
   if(nh.d>FD.rng){stepToward(f,tgt.x,tgt.y,FD.spd*dt);f.mov=true;f.anim+=dt*6;}
   else{f.mov=false;f.cd-=dt;if(f.cd<=0)f.windT=.35;}
  }
 });
}

// ---------- 보스 AI ----------
function choosePattern(f,d,tgt){
 let pool;
 if(f.type==='deimos')pool=d<44?['swing','spin','swing','charge']:['charge','charge','spin'];
 else if(f.phase===2)pool=d<55?['swing','combo','slam','fan','zones','spin']:['charge','slam','fan','zones'];
 else pool=d<55?['swing','combo','charge','swing']:['charge','combo'];
 const k=pool[irnd(0,pool.length-1)];
 f.pat={k,t:0,step:-1};
 if(k==='charge'){
  const dd=dist(f,tgt)||1;
  f.pat.dir={x:(tgt.x-f.x)/dd,y:(tgt.y-f.y)/dd};
  G.fx.push({type:'line',x:f.x,y:f.y,dx:f.pat.dir.x,dy:f.pat.dir.y,t:0,dur:.6,len:150});
  AU.sfx('stun');
 }
}
function bossAI(f,dt){
 const FD=FOES[f.type];
 if(f.type==='garok'&&!G.flags.bossFight){f.mov=false;return;}
 const nh=nearestHero(f); if(!nh)return;
 const tgt=nh.e;
 if(f.type==='garok'&&!G.boss)G.boss=f;
 if(f.type==='deimos'&&f.state==='idle'){
  if(nh.d<FD.aggro){f.state='chase';G.boss=f;AU.sfx('roar');}
  else return;
 }
 if(f.hp<f.mhp*.5&&f.phase===1){
  f.phase=2; f.pat={k:'rage',t:0};
  G.flash=.45; G.flashCol='#a01818'; G.shake=.4; AU.sfx('roar');
  toast(f.type==='garok'?'가로크가 격노했다 — 고대 병기의 힘이 흘러든다!':'데이모스의 갑주가 검게 타오른다!','#ff8a7a');
 }
 if(!f.pat){
  f.patT-=dt; aimFace(f,tgt);
  const spd=FD.spd*(f.phase===2?1.3:1);
  if(nh.d>FD.rng){stepToward(f,tgt.x,tgt.y,spd*dt);f.mov=true;f.anim+=dt*6;}
  else f.mov=false;
  if(f.patT<=0)choosePattern(f,nh.d,tgt);
  return;
 }
 const p=f.pat; p.t+=dt; f.mov=false;
 switch(p.k){
  case 'rage':
   puff(f.x+rnd(-10,10),f.y-rnd(0,20),'#c03030',1,30);
   if(p.t>1.2){f.pat=null;f.patT=.4;}
   break;
  case 'swing':
   if(!p.hit&&p.t>.55){
    p.hit=true; f.atkT=.25; AU.sfx('swing'); G.shake=Math.max(G.shake,.15);
    G.fx.push({type:'slash',x:f.x,y:f.y,dx:f.fx,dy:f.fy,t:0,dur:.2,fol:f,big:true,foe:true});
    heroesArr().forEach(h=>{
     const d=dist(f,h);
     if(d<FD.rng+18){const nx=(h.x-f.x)/(d||1),ny=(h.y-f.y)/(d||1);
      if(nx*f.fx+ny*f.fy>-.2)dmgHero(h,FD.atk*1.2,{kb:130,src:f});}});
   }
   if(p.t>1.0){f.pat=null;f.patT=f.phase===2?rnd(.6,1.3):rnd(1.1,2);}
   break;
  case 'combo':{
   const step=Math.floor(p.t/.42);
   if(step>p.step&&step<=2){
    p.step=step;
    const d=dist(f,tgt)||1;
    p.lx=(tgt.x-f.x)/d; p.ly=(tgt.y-f.y)/d; p.lT=.16;
    f.atkT=.2; AU.sfx('swing');
   }
   if(p.lT>0){
    p.lT-=dt;
    moveEnt(f,p.lx*250*dt,p.ly*250*dt);
    heroesArr().forEach(h=>{
     if(dist(f,h)<FD.rng+8&&!p['h'+p.step+h.id]){p['h'+p.step+h.id]=1;dmgHero(h,FD.atk*.8,{src:f,kb:50});}});
   }
   if(p.t>1.5){f.pat=null;f.patT=rnd(.9,1.8);}
   break;}
  case 'charge':
   aimFace(f,{x:f.x+p.dir.x,y:f.y+p.dir.y});
   if(p.t<.6){}
   else if(p.t<1.15){
    if(!p.go){p.go=true;AU.sfx('dash');}
    const ox=f.x,oy=f.y;
    moveEnt(f,p.dir.x*340*dt,p.dir.y*340*dt);
    puff(f.x,f.y,'#555a66',1,20);
    if(Math.abs(f.x-ox)<.02&&Math.abs(f.y-oy)<.02)p.t=1.2;
    heroesArr().forEach(h=>{
     if(dist(f,h)<f.r+10&&!p['c'+h.id]){p['c'+h.id]=1;dmgHero(h,FD.atk*1.4,{kb:190,src:f});}});
   }
   else if(p.t>1.55){f.pat=null;f.patT=rnd(.9,1.8);}
   break;
  case 'spin':
   if(!p.hit&&p.t>.6){
    p.hit=true; AU.sfx('boom'); G.shake=Math.max(G.shake,.25);
    G.fx.push({type:'ring',x:f.x,y:f.y,t:0,dur:.45,r0:10,r1:64});
    heroesArr().forEach(h=>{if(dist(f,h)<64)dmgHero(h,FD.atk*1.1,{kb:160,src:f});});
   }
   if(p.t>1.2){f.pat=null;f.patT=rnd(1.1,1.9);}
   break;
  case 'slam':
   if(p.t<.85){
    if(!p.aim){p.aim={x:tgt.x,y:tgt.y};G.fx.push({type:'tele',x:p.aim.x,y:p.aim.y,t:0,dur:.85,r:48});AU.sfx('stun');}
    f.jump=Math.sin(Math.min(1,p.t/.85)*Math.PI)*34;
    f.x=lerp(f.x,p.aim.x,dt*3.2); f.y=lerp(f.y,p.aim.y,dt*3.2);
   }else{
    if(!p.hit){
     p.hit=true; f.jump=0; AU.sfx('boom'); G.shake=.4;
     G.fx.push({type:'ring',x:f.x,y:f.y,t:0,dur:.65,r0:10,r1:100,dmg:FD.atk,band:13,hits:{}});
     puff(f.x,f.y,'#8a6a4a',16,100);
     heroesArr().forEach(h=>{if(dist(f,h)<40)dmgHero(h,FD.atk*1.3,{kb:150,src:f});});
    }
    if(p.t>1.4){f.pat=null;f.patT=rnd(.7,1.5);}
   }
   break;
  case 'fan':
   if(!p.hit&&p.t>.45){
    p.hit=true; AU.sfx('fire');
    const base=Math.atan2(tgt.y-f.y,tgt.x-f.x);
    for(let i=0;i<10;i++){
     const a=base+(i-4.5)*.24;
     G.projs.push({x:f.x,y:f.y-10,vx:Math.cos(a)*150,vy:Math.sin(a)*150,dmg:FD.atk*.7,from:'foe',type:'orb',life:2.4});}
   }
   if(p.t>1){f.pat=null;f.patT=rnd(.9,1.7);}
   break;
  case 'zones':
   if(!p.set){
    p.set=true; p.zs=[]; AU.sfx('stun');
    const hs=heroesArr();
    for(let i=0;i<3;i++){
     const h=hs[i%hs.length];
     const zx=h.x+rnd(-34,34),zy=h.y+rnd(-34,34);
     p.zs.push({x:zx,y:zy});
     G.fx.push({type:'tele',x:zx,y:zy,t:0,dur:1,r:30,fire:true});}
   }
   if(!p.hit&&p.t>1){
    p.hit=true; AU.sfx('boom');
    p.zs.forEach(z=>{
     G.fx.push({type:'erupt',x:z.x,y:z.y,t:0,dur:.5});
     heroesArr().forEach(h=>{if(Math.hypot(h.x-z.x,h.y-z.y)<33)dmgHero(h,FD.atk*1.1,{src:f});});});
   }
   if(p.t>1.6){f.pat=null;f.patT=rnd(.9,1.7);}
   break;
 }
}

// ---------- 투사체 · 이펙트 ----------
function updateProjs(dt){
 for(let i=G.projs.length-1;i>=0;i--){
  const p=G.projs[i];
  p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt;
  let dead=p.life<=0||solidAt(p.x,p.y);
  if(!dead){
   if(p.from==='hero'){
    for(const f of foesArr()){
     if(Math.hypot(f.x-p.x,f.y-8-p.y)<f.r+5){dmgFoe(f,p.dmg,{});dead=true;puff(p.x,p.y,'#ff9a4a',6,60);break;}}
   }else{
    for(const h of heroesArr()){
     if(h.inv<=0&&Math.hypot(h.x-p.x,h.y-8-p.y)<h.r+5){dmgHero(h,p.dmg,{});dead=true;break;}}
   }
  }else if(solidAt(p.x,p.y))puff(p.x,p.y,'#888',3,30);
  if(dead)G.projs.splice(i,1);
 }
}
function updateFx(dt){
 for(let i=G.fx.length-1;i>=0;i--){
  const f=G.fx[i];
  f.t+=dt;
  if(f.type==='p'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=60*dt;}
  if(f.fol){f.x=f.fol.x;f.y=f.fol.y;}
  if(f.type==='ring'&&f.dmg){
   const r=lerp(f.r0,f.r1,f.t/f.dur);
   heroesArr().forEach(h=>{
    if(f.hits[h.id])return;
    const d=dist(f,h);
    if(Math.abs(d-r)<f.band){f.hits[h.id]=1;dmgHero(h,f.dmg,{kb:100,src:f});}});
  }
  if(f.t>=f.dur)G.fx.splice(i,1);
 }
 for(let i=G.toasts.length-1;i>=0;i--){const t=G.toasts[i];t.t+=dt;if(t.t>t.dur)G.toasts.splice(i,1);}
}

// ---------- 컷신 ----------
function cs(steps){G.cut={steps,i:-1,w:0};nextCs();}
function nextCs(){
 const c=G.cut; if(!c)return;
 c.i++;
 if(c.i>=c.steps.length){G.cut=null;G.letterT=0;return;}
 const s=c.steps[c.i];
 if(s.d)say(s.d,()=>nextCs());
 else if(s.w!==undefined)c.w=s.w;
 else if(s.f){s.f();nextCs();}
}
function updateCut(dt){
 const c=G.cut;
 if(!c||G.dlg)return;
 if(c.w>0){c.w-=dt;if(c.w<=0)nextCs();}
}

function npcMark(e){

function fadeToMap(to,tx,ty){if(G.fadeM)return;G.fadeM={to,tx,ty,t:0,phase:0};AU.sfx('ui');}
function updateFade(dt){
 const f=G.fadeM; if(!f)return;
 f.t+=dt*3.2;
 if(f.phase===0&&f.t>=1){f.phase=1;loadMap(f.to,f.tx,f.ty);}
 if(f.phase===1){f.t-=dt*6.4;if(f.t<=0)G.fadeM=null;}
}
function checkPortals(){
 if(G.fadeM)return;
 const pl=G.hobjs.rian;
 const tx=Math.floor(pl.x/TS), ty=Math.floor(pl.y/TS);
 for(const p of (G.map.def.portals||[])){
  if(tx>=p.x&&tx<p.x+p.w&&ty>=p.y&&ty<p.y+p.h){
   if(p.cond&&!p.cond()){
    if(!G.portalMsgT||G.t-G.portalMsgT>2.5){G.portalMsgT=G.t;toast(p.msg||'지나갈 수 없다','#ff9a8a');}
    const cxm=G.map.w*TS/2, cym=G.map.h*TS/2;
    const dx=cxm-pl.x, dy=cym-pl.y, m=Math.hypot(dx,dy)||1;
    pl.x+=dx/m*4; pl.y+=dy/m*4;
    return;
   }
   fadeToMap(p.to,p.tx,p.ty);
   return;
  }
 }
}

function useInvItem(idx){
 const slot=G.inv[idx]; if(!slot)return;
 const it=ITEMS[slot.id];
 const pl=G.hobjs.rian, st=heroStats('rian');
 if(it.type==='use'){
  if(slot.id==='pot_m'){
   if(pl.mp>=st.mp){toast('MP가 이미 가득 찼다','#aab');return;}
   pl.mp=Math.min(st.mp,pl.mp+50);
  }else{
   if(pl.hp>=st.hp){toast('HP가 이미 가득 찼다','#aab');return;}
   pl.hp=Math.min(st.hp,pl.hp+(slot.id==='pot_l'?150:60));
  }
  AU.sfx('heal'); G.stats.potions++;
  G.fx.push({type:'heal',x:pl.x,y:pl.y,t:0,dur:.7,fol:pl});
  slot.q--; if(slot.q<=0){G.inv.splice(idx,1);G.sel=Math.max(0,Math.min(G.sel,G.inv.length-1));}
 }else if(it.type==='weapon'||it.type==='armor'||it.type==='acc'){
  const key=it.type==='weapon'?'weapon':it.type==='armor'?'armor':'acc';
  const old=G.equip[key];
  G.equip[key]=slot.id;
  slot.q--; if(slot.q<=0)G.inv.splice(idx,1);
  if(old){const v=G.inv.find(x=>x.id===old);if(v)v.q++;else G.inv.push({id:old,q:1});}
  G.sel=Math.max(0,Math.min(G.sel,G.inv.length-1));
  toast(it.n+' 장착!','#c9e6a8'); AU.sfx('sel');
 }else{
  say([{w:ITEMS[slot.id].n,t:it.d}]);
 }
}
function updateMenus(){
 if(G.mode==='inv'){
  if(once('ArrowUp')||once('w')){G.sel=Math.max(0,G.sel-1);AU.sfx('ui');}
  if(once('ArrowDown')||once('s')){G.sel=Math.min(Math.max(0,G.inv.length-1),G.sel+1);AU.sfx('ui');}
  if(onceAny('Enter','z',' '))useInvItem(G.sel);
  if(onceAny('i','Escape','q'))G.mode='play';
 }else if(G.mode==='log'){
  if(onceAny('q','Escape','i'))G.mode='play';
 }else if(G.mode==='shop'){
  if(once('ArrowUp')||once('w')){G.shopSel=Math.max(0,G.shopSel-1);AU.sfx('ui');}
  if(once('ArrowDown')||once('s')){G.shopSel=Math.min(SHOP.length-1,G.shopSel+1);AU.sfx('ui');}
  if(onceAny('Enter','z',' ')){
   const id=SHOP[G.shopSel], it=ITEMS[id];
   if(G.gold<it.price){toast('골드가 부족하다','#ff9a8a');AU.sfx('ui');}
   else{G.gold-=it.price;give(id);}
  }
  if(onceAny('Escape','e','q','i'))G.mode='play';
 }
}

function wrapText(c,text,x,y,maxW,lh,maxLines=3){
 let line='',ly=y,cnt=0;
 for(const ch of text){
  if(c.measureText(line+ch).width>maxW&&cnt<maxLines-1){c.fillText(line,x,ly);ly+=lh;line=ch;cnt++;}
  else line+=ch;
 }
 c.fillText(line,x,ly);
 return ly;
}

const _PV=(typeof THREE!=='undefined')?new THREE.Vector3():null;
function projW(x,y,h){
 _PV.set(x/TS,h,y/TS).project(camera);
 return {x:(_PV.x*.5+.5)*960, y:(-_PV.y*.5+.5)*540, ok:_PV.z<1&&_PV.z>-1};
}
function drawWorldUI(){
 if(!renderer||!G.map||!camera)return;
 G.ents.forEach(e=>{
  if(e.kind==='foe'){
   const FD=FOES[e.type];
   const s=(FD.big||1);
   if(!FD.boss&&e.hp<e.mhp){
    const p=projW(e.x,e.y,1.55*s);

     cx.fillStyle='rgba(8,5,8,.8)';cx.fillRect(p.x-18,p.y-4,36,7);
     cx.fillStyle='#c0392b';cx.fillRect(p.x-17,p.y-3,34*Math.max(0,e.hp/e.mhp),5);
    }
   }
   if(e.windT>0||e.alertT>0){

     cx.font='bold 19px serif';cx.textAlign='center';
     cx.strokeStyle='rgba(0,0,0,.8)';cx.lineWidth=3;cx.strokeText('!',p.x,p.y);
     cx.fillStyle=e.windT>0?'#ff5a4a':'#ffd76a';cx.fillText('!',p.x,p.y);
     cx.textAlign='left';
    }
   }
  }
  if(e.kind==='npc'){
   const m=npcMark(e);

    if(p.ok){
     const bob=Math.sin(G.t*4)*4;

function update(dt){
 G.t+=dt;
 if(G.flash>0)G.flash-=dt;
 if(G.shake>0)G.shake-=dt;
 G.letter=lerp(G.letter,G.letterT,Math.min(1,dt*6));
 if(G.splash){G.splash.t+=dt;if(G.splash.t>G.splash.dur)G.splash=null;}
 if(G.mapBanner){G.mapBanner.t+=dt;if(G.mapBanner.t>3.5)G.mapBanner=null;}
 if(G.mode==='title'){
  if(onceAny('Enter',' ','z')){G.mode='intro';G.introT=0;AU.sfx('sel');AU.setTheme('ruin');}
  return;}
 if(G.mode==='intro'){
  G.introT+=dt;
  if((onceAny('Enter',' ','z')&&G.introT>1)||G.introT>14.5)newGame();
  return;}
 if(G.mode==='over'){
  G.overT+=dt;
  if(G.overT>1&&onceAny('Enter',' ','z'))respawn();
  return;}
 if(G.mode==='clear'){
  G.clearT+=dt;
  if(G.clearT>3&&onceAny('Enter',' ','z')){G.mode='title';AU.setTheme(null);}
  return;}
 if(once('m')){AU.mus=!AU.mus;toast(AU.mus?'♪ 음악 켜짐':'♪ 음악 꺼짐','#aab');}
 updateFade(dt);
 if(G.fadeM)return;
 if(G.dlg){updateDlg(dt);updateFx(dt);return;}
 if(G.cut){updateCut(dt);updateFx(dt);return;}
 if(G.mode==='inv'||G.mode==='log'||G.mode==='shop'){updateMenus();updateFx(dt);return;}
 // play
 if(once('i')){G.mode='inv';G.sel=0;AU.sfx('sel');return;}
 if(once('q')){G.mode='log';AU.sfx('sel');return;}
 if(once('e')||once('Enter'))tryInteract();
 updateHeroes(dt);
 updateFoes(dt);
 updateProjs(dt);
 updateFx(dt);
 checkPortals();
 checkTriggers();
}

function animateChar(e,a,dt){

 if(e.down){a.rotation.z=1.35;a.position.y=.1;}
 else a.rotation.z=(e.stun>0)?Math.sin(G.t*18)*.07:0;
 const sw=e.mov?Math.sin(e.anim*1.15)*.55:0;
 if(ud.wolf){
  ud.legs[0].rotation.x=sw;ud.legs[3].rotation.x=sw;
  ud.legs[1].rotation.x=-sw;ud.legs[2].rotation.x=-sw;
 }else{
  ud.legL.rotation.x=sw; ud.legR.rotation.x=-sw;
  ud.armL.rotation.x=-sw*.7;
  if(e.atkT>0){const pr=1-(e.atkT/.25);ud.armR.rotation.x=-2.4+Math.min(1,pr)*3;ud.armR.rotation.z=-.3;}
  else if(e.windT>0){ud.armR.rotation.x=-2.4;ud.armR.rotation.z=-.3;}
  else{ud.armR.rotation.x=sw*.7;ud.armR.rotation.z=0;}
 }
 if(!e.down&&e.mov)a.position.y+=Math.abs(Math.sin(e.anim*1.15))*.05;
 const fi=e.hurtT>0?.9:0;
 ud.flash.forEach(m=>m.emissive.setScalar(fi));
 if(FD&&FD.boss&&e.phase===2){
  if(!ud.aura){
   ud.aura=new THREE.Mesh(new THREE.RingGeometry(.75,1,26),new THREE.MeshBasicMaterial({color:0xff3030,transparent:true,opacity:.4,side:THREE.DoubleSide,depthWrite:false}));
   ud.aura.rotation.x=-Math.PI/2;ud.aura.position.y=.05;
   a.add(ud.aura);

  ud.aura.material.opacity=.28+(Math.sin(G.t*6)+1)/2*.3;
  ud.aura.rotation.z=G.t*2;
 }
}

}

function updFxMesh(f,m){
 const pr=Math.min(1,f.t/f.dur);
 m.position.x=f.x/TS; m.position.z=f.y/TS;
 switch(f.type){
  case 'slash':
   m.position.y=.6;
   m.rotation.y=m.userData.yaw-Math.PI/2+pr*1.1;
   m.userData.arc.material.opacity=Math.max(0,.95-pr);
   break;
  case 'spin':{const r=(10+pr*42)/TS;m.scale.set(r,1,r);m.position.y=.22;m.material.opacity=1-pr;break;}
  case 'quake':{const r=(8+pr*52)/TS;m.scale.set(r,1,r);m.position.y=.07;m.material.opacity=1-pr;break;}
  case 'ring':{const r=lerp(f.r0,f.r1,pr)/TS;m.scale.set(r,1,r);m.position.y=.08;m.material.opacity=1-pr;break;}
  case 'lvl':
   m.children[0].material.opacity=.4*(1-pr);
   {const r=.5+pr*1.3;m.children[1].scale.set(r,1,r);m.children[1].material.opacity=Math.max(0,.9-pr);}
   break;
  case 'tele':{
   m.userData.inner.scale.setScalar(Math.max(.02,pr));
   const bl=(Math.sin(f.t*14)+1)/2;
   m.userData.border.material.opacity=.45+bl*.4;
   break;}
  case 'line': m.material.opacity=Math.max(0,.6-.45*pr); break;
  case 'erupt': m.children.forEach((s,i)=>{s.material.opacity=Math.max(0,1-pr*1.3);s.position.y=.25+pr*1.5+i*.18;}); break;
  case 'heal': m.children.forEach(s=>{const a=G.t*3+s.userData.ph;s.position.set(Math.cos(a)*.35,.35+pr*.95,Math.sin(a)*.35);s.material.opacity=Math.max(0,1-pr);}); break;
  case 'p': m.position.y=.22+Math.sin(pr*Math.PI)*.35; m.material.opacity=Math.max(0,1-pr); break;
 }
}
function syncSet(map,list,mkFn,updFn){
 const live=new Set(list);
 map.forEach((m,k)=>{if(!live.has(k)){scene.remove(m);map.delete(k);}});
 list.forEach(o=>{
  let m=map.get(o);
  if(!m){m=mkFn(o);if(!m)return;scene.add(m);map.set(o,m);}
  updFn(o,m);});
}

function update3D(dt){

 AV.forEach((a,e)=>{if(!G.ents.includes(e)){scene.remove(a);AV.delete(e);}});

  a.rotation.y=Math.atan2(e.fx||0,e.fy||1);
  animateChar(e,a,dt);
 });
 // 투사체/이펙트
 syncSet(PJ3,G.projs,mkProjMesh,(p,m)=>{
  m.position.set(p.x/TS,.6,p.y/TS);
  if(p.type==='arrow')m.rotation.y=Math.atan2(p.vx,p.vy);
 });
 syncSet(FX3,G.fx.filter(f=>f.type!=='txt'),mkFxMesh,updFxMesh);
 // 카메라
 const pl=G.hobjs.rian;
 if(G.mode==='title'){
  const a=G.t*.16;
  camera.position.set(camTgt.x+Math.sin(a)*9,6.2+Math.sin(G.t*.3)*.5,camTgt.z+Math.cos(a)*9);
  camera.lookAt(camTgt.x,.9,camTgt.z);
  if(plLight)plLight.position.set(camTgt.x,1.8,camTgt.z);
  const d=G.sunDir||[-6,11,4];
  sun.position.set(camTgt.x+d[0],d[1],camTgt.z+d[2]);
  sun.target.position.set(camTgt.x,0,camTgt.z);
 }else if(pl){
  camTgt.lerp(new THREE.Vector3(pl.x/TS,0,pl.y/TS),1-Math.pow(.0006,dt));
  const shk=Math.max(0,G.shake);
  const ox=(Math.random()-.5)*shk*.6, oy=(Math.random()-.5)*shk*.5;
  camera.position.set(camTgt.x+ox,9.3+oy,camTgt.z+7.4);
  camera.lookAt(camTgt.x,0.45,camTgt.z-.4);
  if(plLight)plLight.position.set(pl.x/TS,1.7,pl.y/TS);
  const d=G.sunDir||[-6,11,4];
  sun.position.set(camTgt.x+d[0],d[1],camTgt.z+d[2]);
  sun.target.position.set(camTgt.x,0,camTgt.z);
 }
 // 환경 애니메이션
 flameSprites.forEach(f=>{const p=(Math.sin(G.t*9+f.ph)+1)/2;f.s.scale.set(.36+p*.12,.5+p*.2,1);f.s.material.opacity=.7+p*.3;});
 waterMats.forEach(m=>{m.opacity=.74+Math.sin(G.t*1.6)*.08;});
 crystalMats.forEach((m,i)=>{m.emissiveIntensity=.5+((Math.sin(G.t*3+i*1.4)+1)/2)*.55;});
 coreObjs.forEach(o=>{
  const p=(Math.sin(G.t*2.2)+1)/2;
  o.mesh.scale.setScalar(1+p*.13);
  o.mesh.rotation.y=G.t*.6;
  if(o.light)o.light.intensity=1.7+p*1.3;
  if(o.ring)o.ring.rotation.z=G.t*.8;
 });
 dynLights.forEach(L=>{L.l.intensity=L.base*(0.82+Math.sin(G.t*7+L.ph)*.18);});
 if(ptsEmber){
  ptsEmber.position.set(camTgt.x,0,camTgt.z);
  const arr=ptsEmber.geometry.attributes.position.array;
  const spd=ptsEmber.userData.spd;
  for(let i=0;i<arr.length;i+=3){
   arr[i+1]+=spd*dt*(1+(i%5)*.2);
   arr[i]+=Math.sin(G.t+i)*dt*.15;
   if(arr[i+1]>5){arr[i+1]=0;arr[i]=rnd(-14,14);arr[i+2]=rnd(-14,14);}
  }
  ptsEmber.geometry.attributes.position.needsUpdate=true;
 }
}

// ---------- 초기화 ----------
function init3D(){
 if(typeof THREE==='undefined'){
  document.getElementById('nonet').style.display='flex';
  return;
 }
 const glc=document.getElementById('gl');
 renderer=new THREE.WebGLRenderer({canvas:glc,antialias:true});
 renderer.setSize(960,540,false);
 renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 // LinearEncoding(기본) 유지 — 다크 판타지 무드용 로우키 톤
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x0a0a12);
 camera=new THREE.PerspectiveCamera(48,960/540,.1,140);
 camera.position.set(0,9.3,7.4);
 camTgt=new THREE.Vector3(0,0,0);
 hemi=new THREE.HemisphereLight(0x5a6a9a,0x1a1620,.6);scene.add(hemi);
 ambL=new THREE.AmbientLight(0x30364a,.35);scene.add(ambL);
 sun=new THREE.DirectionalLight(0xffd9a8,.75);
 sun.castShadow=true;
 sun.shadow.mapSize.set(2048,2048);
 const sc=sun.shadow.camera;
 sc.left=-16;sc.right=16;sc.top=16;sc.bottom=-16;sc.near=1;sc.far=60;
 sun.shadow.bias=-0.0008;
 scene.add(sun);scene.add(sun.target);
 plLight=new THREE.PointLight(0xffe2b0,.6,7,2);
 scene.add(plLight);
 initTex();
}

 if(!renderer)return;
 G.titleDemo=true;
 G.hobjs={rian:mkHero('rian')};
 G.party=['rian'];
 loadMap('vill',22,12);
 G.titleDemo=false;
 G.mapBanner=null;
 AU.setTheme(null);
}
init3D();
titleDiorama();
requestAnimationFrame(frame);
